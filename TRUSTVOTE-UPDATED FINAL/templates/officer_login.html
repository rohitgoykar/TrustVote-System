<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Officer Login - TrustVote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        
        body {
            min-height: 100vh;
            width: 100vw;
            background: #020206;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* ── Fullscreen Live Glowing Wave Ribbon Canvas ── */
        #ribbonCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .tricolor-stripe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #ff9933 33%, #ffffff 33%, #ffffff 66%, #138808 66%);
            z-index: 100;
        }

        /* ── Dark Frosted Aero-Glass Login Box ── */
        .login-box {
            background: rgba(10, 15, 30, 0.78);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 42px 38px;
            border-radius: 28px;
            box-shadow: 
                0 30px 70px -15px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(16, 185, 129, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            width: 100%;
            max-width: 440px;
            text-align: center;
            z-index: 10;
            position: relative;
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.97); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .seal-icon {
            width: 68px;
            height: 68px;
            background: rgba(15, 23, 42, 0.9);
            color: #34d399;
            border: 1.5px solid rgba(16, 185, 129, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3), 0 8px 16px rgba(0, 0, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-box:hover .seal-icon {
            transform: rotate(-10deg) scale(1.05);
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.4);
            border-color: rgba(52, 211, 153, 0.5);
            color: #6ee7b7;
        }

        .badge-2fa {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        p.sub-title {
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }
        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            bottom: 14px;
            color: #64748b;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 500;
            color: #ffffff;
            background: rgba(15, 23, 42, 0.65);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }
        input::placeholder {
            color: #64748b;
        }
        input:focus {
            border-color: #10b981;
            box-shadow: 
                0 0 0 3px rgba(16, 185, 129, 0.25),
                0 10px 25px -5px rgba(0, 0, 0, 0.5);
            background: rgba(15, 23, 42, 0.85);
        }
        input:focus + .input-icon {
            color: #10b981;
        }

        .otp-input-field {
            letter-spacing: 10px;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            padding: 14px;
            border: 2px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        }
        .otp-input-field:focus {
            border-color: #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 8px;
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 8px 28px rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }
        .btn-submit:active {
            transform: translateY(1px);
        }

        .alert {
            font-size: 13px;
            font-weight: 600;
            padding: 11px 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.4;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: shake 0.5s ease forwards;
        }

        .sms-notice-card {
            background: rgba(16, 185, 129, 0.12);
            border: 1.5px solid rgba(16, 185, 129, 0.35);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .sms-notice-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.18);
            color: #34d399;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sms-notice-card strong {
            color: #34d399 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .step-transition {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .action-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 12.5px;
        }
        .btn-link {
            background: none;
            border: none;
            color: #34d399;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-size: 12.5px;
            text-decoration: underline;
            transition: color 0.2s ease;
        }
        .btn-link:hover {
            color: #6ee7b7;
        }
        .btn-link:disabled {
            color: #64748b;
            cursor: not-allowed;
            text-decoration: none;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .back-btn:hover {
            color: #ffffff;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

<div class="tricolor-stripe"></div>
<canvas id="ribbonCanvas"></canvas>

<div class="login-box">
    <div class="seal-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 11V3a2 2 0 0 0-2-2H10"/>
        </svg>
    </div>
    
    <div class="badge-2fa">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Secured Mobile 2FA Verification
    </div>

    <h2>Officer Login</h2>
    <p class="sub-title">Registration Officer Portal (मतदार नोंदणी कक्ष)</p>
    
    <!-- Error Alert Box -->
    <div id="error-msg" class="alert alert-error" style="display:none;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0; margin-top:2px;">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-text"></span>
    </div>

    <!-- STEP 1: CREDENTIALS & REGISTERED MOBILE -->
    <div id="step-credentials" class="step-transition">
        <form id="step1Form" onsubmit="requestOfficerOtp(event)">
            <div class="input-group">
                <label class="input-label">Username / युजरनेम</label>
                <div style="position:relative;">
                    <input type="text" id="username" placeholder="e.g. officer1" autocomplete="username" required>
                    <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Password / पासवर्ड</label>
                <div style="position:relative;">
                    <input type="password" id="password" placeholder="Enter officer password" autocomplete="current-password" required>
                    <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Registered Mobile No / अधिकृत मोबाईल नंबर</label>
                <div style="position:relative;">
                    <input type="tel" id="mobile" placeholder="10-digit registered mobile" maxlength="10" pattern="[0-9]{10}" autocomplete="tel" required>
                    <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                        <line x1="12" y1="18" x2="12.01" y2="18"/>
                    </svg>
                </div>
            </div>

            <button type="submit" id="btn-step1" class="btn-submit">
                <span>Verify & Send OTP to Mobile</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>
    </div>

    <!-- STEP 2: 6-DIGIT OTP VERIFICATION -->
    <div id="step-otp" style="display:none;" class="step-transition">
        <div class="sms-notice-card">
            <div class="sms-notice-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                </svg>
            </div>
            <div>
                <div style="font-size:13px; font-weight:800; color:#166534; margin-bottom:2px;">
                    SMS Sent to Registered Mobile
                </div>
                <div style="font-size:12px; color:#334155; line-height:1.4;">
                    6-digit verification code has been dispatched to <strong id="disp-masked-mobile" style="color:#15803d;"></strong>. Please check your SMS inbox.
                </div>
            </div>
        </div>

        <form id="step2Form" onsubmit="verifyOfficerOtp(event)">
            <div class="input-group">
                <label class="input-label" style="text-align:center;">
                    Enter 6-Digit SMS Verification Code
                </label>
                <input type="text" id="otp_code" class="otp-input-field" placeholder="• • • • • •" maxlength="6" pattern="[0-9]{6}" required autofocus>
            </div>

            <button type="submit" id="btn-step2" class="btn-submit">
                <span>Verify OTP & Access Portal</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6L9 17l-5-5"/>
                </svg>
            </button>
        </form>

        <div class="action-links">
            <button type="button" class="btn-link" onclick="backToStep1()">← Change Mobile / Credentials</button>
            <button type="button" id="btn-resend" class="btn-link" onclick="resendOfficerOtp()">Resend OTP (<span id="countdown">30</span>s)</button>
        </div>
    </div>
    
    <a href="/" class="back-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Home
    </a>
</div>

<script>
let countdownTimer = null;
let countdownSecs = 30;

function showError(msg) {
    const errDiv = document.getElementById('error-msg');
    const errText = document.getElementById('error-text');
    errDiv.style.display = 'none';
    void errDiv.offsetWidth;
    errText.textContent = msg;
    errDiv.style.display = 'flex';
}

function clearError() {
    document.getElementById('error-msg').style.display = 'none';
}

async function requestOfficerOtp(e) {
    if (e) e.preventDefault();
    clearError();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const mobile = document.getElementById('mobile').value.trim().replace(/[^0-9]/g, '');

    if (!username || !password || !mobile) {
        showError("Please enter username, password, and registered 10-digit mobile number.");
        return;
    }

    if (mobile.length !== 10) {
        showError("Please enter a valid 10-digit mobile number.");
        return;
    }

    const btn = document.getElementById('btn-step1');
    btn.disabled = true;
    btn.innerHTML = '<span>Verifying & Sending SMS...</span>';

    try {
        const res = await fetch('/officer/send_otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, password, mobile })
        });
        const result = await res.json();

        if (result.status === 'success') {
            document.getElementById('step-credentials').style.display = 'none';
            document.getElementById('step-otp').style.display = 'block';
            document.getElementById('disp-masked-mobile').textContent = result.masked_mobile || `+91 ******${mobile.slice(-4)}`;
            startCountdown();
            setTimeout(() => { document.getElementById('otp_code').focus(); }, 100);
        } else {
            showError(result.message || "Authentication failed.");
        }
    } catch (err) {
        showError("Network error communicating with the authentication server.");
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Verify & Send OTP to Mobile</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }
}

async function verifyOfficerOtp(e) {
    if (e) e.preventDefault();
    clearError();

    const otp = document.getElementById('otp_code').value.trim();
    if (!otp || otp.length !== 6) {
        showError("Please enter the complete 6-digit OTP code received via SMS.");
        return;
    }

    const btn = document.getElementById('btn-step2');
    btn.disabled = true;
    btn.innerHTML = '<span>Authorizing Session...</span>';

    try {
        const res = await fetch('/officer/verify_otp', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ otp })
        });
        const result = await res.json();

        if (result.status === 'success') {
            window.location.replace(result.redirect_url || '/register_page');
        } else {
            showError(result.message || "Invalid OTP code entered.");
            btn.disabled = false;
            btn.innerHTML = '<span>Verify OTP & Access Portal</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>';
        }
    } catch (err) {
        showError("Network error validating OTP code.");
        btn.disabled = false;
        btn.innerHTML = '<span>Verify OTP & Access Portal</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>';
    }
}

function startCountdown() {
    clearInterval(countdownTimer);
    countdownSecs = 30;
    const resendBtn = document.getElementById('btn-resend');
    resendBtn.disabled = true;
    resendBtn.innerHTML = `Resend OTP (<span id="countdown">${countdownSecs}</span>s)`;

    countdownTimer = setInterval(() => {
        countdownSecs--;
        const cdSpan = document.getElementById('countdown');
        if (cdSpan) cdSpan.textContent = countdownSecs;

        if (countdownSecs <= 0) {
            clearInterval(countdownTimer);
            resendBtn.disabled = false;
            resendBtn.textContent = 'Resend OTP';
        }
    }, 1000);
}

function resendOfficerOtp() {
    requestOfficerOtp(null);
}

function backToStep1() {
    clearInterval(countdownTimer);
    clearError();
    document.getElementById('step-otp').style.display = 'none';
    document.getElementById('step-credentials').style.display = 'block';
}
</script>

<script>
// ══════════════════════════════════════════════════════════════════════
//  Glowing Wave Ribbons & Particle Spray Canvas Simulation
//  (Dynamic Aurora Ribbons with Chromatic Color Transitions & Stardust)
// ══════════════════════════════════════════════════════════════════════
(function() {
    const canvas = document.getElementById('ribbonCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    
    let W = 0, H = 0, dpr = 1;
    let t = 0;
    let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;

    function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
        targetMouseX = e.clientX;
        targetMouseY = e.clientY;
    });

    // ── Click Burst Sparks ──
    const burstParticles = [];
    window.addEventListener('click', (e) => {
        const colors = [
            'rgba(217, 70, 239,',
            'rgba(236, 72, 153,',
            'rgba(249, 115, 22,',
            'rgba(234, 179, 8,',
            'rgba(34, 197, 94,'
        ];
        for (let i = 0; i < 24; i++) {
            const angle = (Math.PI * 2 / 24) * i + (Math.random() - 0.5) * 0.3;
            const spd = Math.random() * 4 + 2;
            burstParticles.push({
                x: e.clientX,
                y: e.clientY,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                alpha: 1,
                decay: Math.random() * 0.02 + 0.015,
                size: Math.random() * 2.2 + 1,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }
    });

    // ── Cubic Bezier Evaluator with Tangent/Normal ──
    function evalBezier(p0, p1, p2, p3, u) {
        const omt = 1 - u;
        const omt2 = omt * omt;
        const omt3 = omt2 * omt;
        const u2 = u * u;
        const u3 = u2 * u;

        const x = omt3 * p0.x + 3 * omt2 * u * p1.x + 3 * omt * u2 * p2.x + u3 * p3.x;
        const y = omt3 * p0.y + 3 * omt2 * u * p1.y + 3 * omt * u2 * p2.y + u3 * p3.y;

        const dx = 3 * omt2 * (p1.x - p0.x) + 6 * omt * u * (p2.x - p1.x) + 3 * u2 * (p3.x - p2.x);
        const dy = 3 * omt2 * (p1.y - p0.y) + 6 * omt * u * (p2.y - p1.y) + 3 * u2 * (p3.y - p2.y);
        const len = Math.sqrt(dx * dx + dy * dy) || 1;

        return { x, y, nx: -dy / len, ny: dx / len };
    }

    // ── Ribbon Configuration matching the reference image ──
    function getRibbonPath(ribbonId, u, time) {
        let p0, p1, p2, p3;
        if (ribbonId === 1) {
            // Ribbon 1: Sweeps from top-left/center across to right
            p0 = { x: W * 0.15, y: -H * 0.12 };
            p1 = { x: W * 0.45, y: H * 0.16 };
            p2 = { x: W * 0.72, y: H * 0.38 };
            p3 = { x: W * 1.15, y: H * 0.78 };
        } else {
            // Ribbon 2: Sweeps from lower-left across towards bottom-right
            p0 = { x: -W * 0.12, y: H * 0.32 };
            p1 = { x: W * 0.12,  y: H * 0.64 };
            p2 = { x: W * 0.40,  y: H * 0.88 };
            p3 = { x: W * 0.92,  y: H * 1.18 };
        }

        const pt = evalBezier(p0, p1, p2, p3, u);

        // Sinusoidal wave breathing
        const wave = Math.sin(u * 4.5 + time * 0.0016 + ribbonId * 2.2) * 16 * Math.sin(u * Math.PI);

        // Interactive mouse deflection
        const mDistX = pt.x - mouseX;
        const mDistY = pt.y - mouseY;
        const mDist = Math.sqrt(mDistX * mDistX + mDistY * mDistY) + 1;
        const mPush = Math.max(0, 1 - mDist / 320) * 32;

        return {
            x: pt.x + pt.nx * (wave + mPush),
            y: pt.y + pt.ny * (wave + mPush),
            nx: pt.nx,
            ny: pt.ny
        };
    }

    // ── Chromatic Color Interpolator along Ribbon (Magenta -> Red -> Orange -> Gold -> Lime) ──
    function getColorAt(u, alpha = 1) {
        if (u < 0.22) {
            // Neon Magenta / Violet
            return `rgba(217, 70, 239, ${alpha})`;
        } else if (u < 0.42) {
            // Hot Pink / Crimson
            return `rgba(244, 63, 94, ${alpha})`;
        } else if (u < 0.68) {
            // Radiant Orange
            return `rgba(249, 115, 22, ${alpha})`;
        } else if (u < 0.86) {
            // Golden Yellow
            return `rgba(234, 179, 8, ${alpha})`;
        } else {
            // Emerald / Lime Green
            return `rgba(34, 197, 94, ${alpha})`;
        }
    }

    // ── Generate Stardust Particles along Ribbon Curves ──
    const PARTICLE_COUNT = 520;
    const particles = [];

    function initParticles() {
        particles.length = 0;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const ribbonId = i % 2 === 0 ? 1 : 2;
            const u = Math.random();
            // Normal-like distribution for lateral spread
            const spread = (Math.random() - 0.5 + (Math.random() - 0.5)) * 140;
            particles.push({
                ribbonId: ribbonId,
                u: u,
                spread: spread,
                speed: Math.random() * 0.0006 + 0.0002,
                size: Math.random() * 1.8 + 0.6,
                twinkleSpeed: Math.random() * 0.004 + 0.002,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    // ── Render Layered Multi-Strand Glowing Ribbons ──
    function drawRibbons(time) {
        const STRANDS = 22; // 22 layered silk lines per ribbon
        const SAMPLES = 60;

        for (let rId = 1; rId <= 2; rId++) {
            for (let s = 0; s < STRANDS; s++) {
                const strandFrac = (s / (STRANDS - 1)) - 0.5; // -0.5 to +0.5
                const strandOffset = strandFrac * 42;

                ctx.beginPath();
                for (let i = 0; i <= SAMPLES; i++) {
                    const u = i / SAMPLES;
                    const pt = getRibbonPath(rId, u, time);
                    const envelope = Math.sin(u * Math.PI);
                    const waveMod = Math.sin(u * 7 + s * 0.35 + time * 0.002) * 8 * envelope;
                    const finalOffset = (strandOffset + waveMod) * envelope;

                    const px = pt.x + pt.nx * finalOffset;
                    const py = pt.y + pt.ny * finalOffset;

                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }

                // Create linear gradient along the ribbon
                const grad = ctx.createLinearGradient(
                    rId === 1 ? W * 0.2 : 0,
                    rId === 1 ? 0 : H * 0.4,
                    rId === 1 ? W : W * 0.9,
                    rId === 1 ? H * 0.7 : H
                );
                const alpha = (0.24 - Math.abs(strandFrac) * 0.16);
                grad.addColorStop(0.00, `rgba(192, 38, 211, ${alpha})`);  // Magenta
                grad.addColorStop(0.28, `rgba(244, 63, 94, ${alpha})`);   // Crimson Pink
                grad.addColorStop(0.58, `rgba(249, 115, 22, ${alpha})`);  // Radiant Orange
                grad.addColorStop(0.82, `rgba(234, 179, 8, ${alpha})`);   // Gold
                grad.addColorStop(1.00, `rgba(34, 197, 94, ${alpha * 0.8})`); // Lime

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.6;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }
    }

    // ── Render Particles / Stardust Spray ──
    function drawParticles(time) {
        for (const p of particles) {
            p.u += p.speed;
            if (p.u > 1.04) {
                p.u = -0.04;
                p.spread = (Math.random() - 0.5 + (Math.random() - 0.5)) * 140;
            }

            const pt = getRibbonPath(p.ribbonId, Math.max(0, Math.min(1, p.u)), time);
            const envelope = Math.sin(p.u * Math.PI);
            const px = pt.x + pt.nx * p.spread * envelope;
            const py = pt.y + pt.ny * p.spread * envelope;

            if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;

            const twinkle = Math.sin(time * p.twinkleSpeed + p.phase);
            const alpha = Math.max(0.15, Math.min(1, 0.55 + twinkle * 0.45));

            ctx.fillStyle = getColorAt(p.u, alpha);
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();

            // Glow halo for larger sparks
            if (p.size > 1.5 && alpha > 0.6) {
                ctx.fillStyle = getColorAt(p.u, alpha * 0.3);
                ctx.beginPath();
                ctx.arc(px, py, p.size * 2.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw Click Burst Sparks
        for (let i = burstParticles.length - 1; i >= 0; i--) {
            const bp = burstParticles[i];
            bp.x += bp.vx;
            bp.y += bp.vy;
            bp.vx *= 0.95;
            bp.vy *= 0.95;
            bp.alpha -= bp.decay;

            if (bp.alpha <= 0) {
                burstParticles.splice(i, 1);
                continue;
            }

            ctx.fillStyle = `${bp.color}${bp.alpha})`;
            ctx.beginPath();
            ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ── Main Animation Loop ──
    function render(time) {
        t = time;

        // Smooth mouse coords
        mouseX += (targetMouseX - mouseX) * 0.06;
        mouseY += (targetMouseY - mouseY) * 0.06;

        // Dark obsidian background with subtle vignette depth
        ctx.fillStyle = '#020206';
        ctx.fillRect(0, 0, W, H);

        // Soft ambient corner glows matching the ribbons
        const g1 = ctx.createRadialGradient(W * 0.85, H * 0.15, 0, W * 0.85, H * 0.15, W * 0.5);
        g1.addColorStop(0, 'rgba(236, 72, 153, 0.07)');
        g1.addColorStop(1, 'rgba(2, 2, 6, 0)');
        ctx.fillStyle = g1;
        ctx.fillRect(0, 0, W, H);

        const g2 = ctx.createRadialGradient(W * 0.15, H * 0.85, 0, W * 0.15, H * 0.85, W * 0.5);
        g2.addColorStop(0, 'rgba(249, 115, 22, 0.07)');
        g2.addColorStop(1, 'rgba(2, 2, 6, 0)');
        ctx.fillStyle = g2;
        ctx.fillRect(0, 0, W, H);

        drawRibbons(time);
        drawParticles(time);

        requestAnimationFrame(render);
    }

    resize();
    initParticles();
    requestAnimationFrame(render);
})();
</script>
