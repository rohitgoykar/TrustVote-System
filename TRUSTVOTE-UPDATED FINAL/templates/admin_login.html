<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Election Officer Login - TrustVote (महाराष्ट्र राज्य निवडणूक आयोग)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.96);
            --border-card: rgba(203, 213, 225, 0.9);
            --text-main: #0f172a;
            --text-muted: #334155;
            --text-subtle: #64748b;
            --accent-saffron: #ea580c;
            --accent-blue: #0284c7;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            color: var(--text-main);
        }

        /* Animated Indian Flag Background */
        .flag-bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .flag-bg-image {
            position: absolute;
            top: -6%; left: -6%;
            width: 112%; height: 112%;
            background: url('/static/india_flag_bg.png') no-repeat center center;
            background-size: cover;
            filter: brightness(0.92) saturate(1.18) contrast(1.05);
            animation: flagCinematicMotion 24s ease-in-out infinite alternate;
            transform-origin: 60% 40%;
        }

        @keyframes flagCinematicMotion {
            0% {
                transform: scale(1) translate(0, 0) rotate(0deg);
                filter: brightness(0.90) saturate(1.15) contrast(1.05);
            }
            35% {
                transform: scale(1.04) translate(-1.5%, 0.8%) rotate(0.4deg);
                filter: brightness(0.95) saturate(1.20) contrast(1.08);
            }
            70% {
                transform: scale(1.02) translate(1.2%, -0.6%) rotate(-0.25deg);
                filter: brightness(0.91) saturate(1.16) contrast(1.06);
            }
            100% {
                transform: scale(1.06) translate(0.5%, 1.2%) rotate(0.25deg);
                filter: brightness(0.97) saturate(1.22) contrast(1.10);
            }
        }

        .flag-bg-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(248, 250, 252, 0.84) 45%, rgba(241, 245, 249, 0.95) 100%),
                        radial-gradient(circle at 85% 15%, rgba(255, 153, 51, 0.18) 0%, transparent 55%),
                        radial-gradient(circle at 15% 85%, rgba(21, 128, 61, 0.14) 0%, transparent 60%);
        }

        .flag-glow-aura {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 78% 22%, rgba(255, 190, 60, 0.20) 0%, transparent 48%);
            animation: pulseGoldenAura 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGoldenAura {
            0% { opacity: 0.35; }
            50% { opacity: 0.75; }
            100% { opacity: 0.45; }
        }

        .tricolor-stripe {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 5px;
            background: linear-gradient(to right, #ff9933 33%, #ffffff 33%, #ffffff 66%, #138808 66%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        #astroCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ── Frosted Glass Light Login Box ── */
        .login-box {
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid var(--border-card);
            padding: 42px 36px;
            border-radius: 28px;
            box-shadow: 0 20px 60px -15px rgba(15, 23, 42, 0.16), 0 0 35px rgba(234, 88, 12, 0.10);
            width: 440px;
            max-width: 92vw;
            text-align: center;
            z-index: 10;
            position: relative;
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Official Government Maharashtra Header Banner */
        .govt-official-header {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .govt-banner-card {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 7px 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            border: 1.5px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .govt-banner-img {
            max-width: 100%;
            height: 48px;
            object-fit: contain;
            display: block;
        }
        .govt-state-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--accent-saffron);
            text-transform: uppercase;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 3px 12px;
            border-radius: 9999px;
        }
        .govt-seal-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-saffron);
            box-shadow: 0 0 6px rgba(234, 88, 12, 0.6);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            letter-spacing: -0.4px;
        }
        p.sub-title {
            font-size: 13px;
            font-weight: 600;
            color: #0284c7;
            margin-bottom: 24px;
        }

        /* Form Controls */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        input {
            width: 100%;
            padding: 13px 16px 13px 46px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            background: #ffffff;
            transition: all 0.25s ease;
            outline: none;
        }
        input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }
        input:focus {
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15);
        }
        input:focus + .input-icon {
            color: #ea580c;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ea580c, #c2410c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 8px;
            box-shadow: 0 6px 18px rgba(234, 88, 12, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #c2410c, #9a3412);
            box-shadow: 0 8px 22px rgba(234, 88, 12, 0.4);
            transform: translateY(-2px);
        }

        .alert {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            color: #0f172a;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

<div class="tricolor-stripe"></div>

<!-- Animated Indian National Flag Background -->
<div class="flag-bg-container">
    <div class="flag-bg-image"></div>
    <div class="flag-bg-overlay"></div>
    <div class="flag-glow-aura"></div>
</div>

<canvas id="astroCanvas"></canvas>

<div class="login-box">
    <!-- Official Government Branding Header -->
    <div class="govt-official-header">
        <div class="govt-banner-card">
            <img src="/static/govt_maha_banner.png" alt="महाराष्ट्र शासन - Government of Maharashtra" class="govt-banner-img">
        </div>
        <div class="govt-state-badge">
            <span class="govt-seal-dot"></span>
            <span>महाराष्ट्र शासन • Government of Maharashtra</span>
        </div>
    </div>
    
    <h2>Main Election Officer</h2>
    <p class="sub-title">मुख्य निवडणूक अधिकारी • State Cloud Control Portal</p>
    
    <div id="error-msg" class="alert" style="display:none;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-text"></span>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <button type="submit">Login to Control</button>
    </form>
    
    <a href="/" class="back-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Home
    </a>
</div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };
    
    const errDiv = document.getElementById('error-msg');
    errDiv.style.display = 'none';
    
    try {
        const res = await fetch('/admin/login_api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if(result.status === 'success') {
            window.location.replace('/admin/dashboard');
        } else {
            errDiv.style.display = 'none';
            void errDiv.offsetWidth;
            document.getElementById('error-text').textContent = result.message;
            errDiv.style.display = 'flex';
        }
    } catch(err) {
        document.getElementById('error-text').textContent = "Network error connecting to server";
        errDiv.style.display = 'flex';
    }
};

// Interactive Ambient Embers Canvas
(function() {
    const canvas = document.getElementById('astroCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const COLOR_PALETTE = [
        { r: 234, g: 88,  b: 12 },
        { r: 217, g: 119, b: 6 },
        { r: 2,   g: 132, b: 199 },
        { r: 21,  g: 128, b: 61 }
    ];

    class SparkParticle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 2.2 + 0.8;
            this.speedY = -(Math.random() * 0.45 + 0.2);
            this.speedX = (Math.random() - 0.45) * 0.35;
            this.color = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
            this.alpha = Math.random() * 0.55 + 0.25;
        }

        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.y < -20) this.y = height + 10;
            if (this.x < -20) this.x = width + 10;
            if (this.x > width + 20) this.x = -10;
        }

        draw() {
            ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    const particles = [];
    for (let i = 0; i < 60; i++) particles.push(new SparkParticle());

    function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
})();
</script>

</body>
</html>
