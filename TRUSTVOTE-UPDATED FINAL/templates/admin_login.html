<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Login - TrustVote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Gradient Blobs */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 1;
        }
        .blob-orange {
            top: -10%;
            left: -10%;
            width: 550px;
            height: 550px;
            background: #f97316;
            animation: float-orange 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .blob-green {
            bottom: -10%;
            right: -10%;
            width: 650px;
            height: 650px;
            background: #22c55e;
            animation: float-green 22s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes float-orange {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(100px, 80px) scale(1.15) rotate(45deg); }
            100% { transform: translate(-50px, 120px) scale(0.9) rotate(90deg); }
        }
        @keyframes float-green {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-120px, -70px) scale(0.85) rotate(-60deg); }
            100% { transform: translate(80px, -40px) scale(1.1) rotate(-120deg); }
        }

        .tricolor-stripe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #ff9933 33%, #ffffff 33%, #ffffff 66%, #138808 66%);
            z-index: 100;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 50px 40px;
            border-radius: 32px;
            box-shadow: 
                0 30px 60px -15px rgba(15, 23, 42, 0.1),
                0 0 50px rgba(255, 255, 255, 0.4) inset;
            width: 400px;
            text-align: center;
            z-index: 10;
            position: relative;
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Official seal outline */
        .seal-icon {
            width: 76px;
            height: 76px;
            background: #fff7ed;
            color: #ea580c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 16px rgba(234, 88, 12, 0.08);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .login-box:hover .seal-icon {
            transform: rotate(-10deg) scale(1.05);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        p.sub-title {
            font-size: 13.5px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 35px;
        }

        /* Form Controls */
        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 1.5px solid rgba(226, 232, 240, 0.8);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            background: #ffffff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }
        input::placeholder {
            color: #94a3b8;
        }
        input:focus {
            border-color: #ea580c;
            box-shadow: 
                0 0 0 4px rgba(234, 88, 12, 0.15),
                0 10px 20px -5px rgba(234, 88, 12, 0.08);
            background: #ffffff;
            transform: translateY(-2px);
        }
        input:focus + .input-icon {
            color: #ea580c;
            transform: translateY(-50%) scale(1.05);
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 12px;
            box-shadow: 0 4px 14px rgba(234, 88, 12, 0.2);
        }
        button:hover {
            background: #d97706;
            box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
        }

        .alert {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fee2e2;
            font-size: 13.5px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .back-btn:hover {
            color: #0f172a;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>

<div class="tricolor-stripe"></div>
<div class="bg-blob blob-orange"></div>
<div class="bg-blob blob-green"></div>

<div class="login-box">
    <div class="seal-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
    </div>
    
    <h2>Admin Login</h2>
    <p class="sub-title">System Control Center Portal</p>
    
    <div id="error-msg" class="alert" style="display:none;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-text"></span>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required>
            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <button type="submit">Login to Control</button>
    </form>
    
    <a href="/" class="back-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Home
    </a>
</div>

<script>
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const data = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };
    
    const errDiv = document.getElementById('error-msg');
    errDiv.style.display = 'none';
    
    try {
        const res = await fetch('/admin/login_api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if(result.status === 'success') {
            window.location.replace('/admin');
        } else {
            errDiv.style.display = 'none';
            void errDiv.offsetWidth; // trigger reflow
            document.getElementById('error-text').textContent = result.message;
            errDiv.style.display = 'flex';
        }
    } catch(err) {
        document.getElementById('error-text').textContent = "Network error connecting to server";
        errDiv.style.display = 'flex';
    }
};
</script>

</body>
</html>
